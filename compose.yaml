services:
  app:
    build: .
    image: mydailynews:local
    working_dir: /app
    environment:
      MYDAILYNEWS_AI_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - .:/app
    command: ["python", "main.py", "--config", "config.recommended.json"]

  gui:
    build: .
    image: mydailynews:local
    working_dir: /app
    environment:
      MYDAILYNEWS_AI_BASE_URL: http://host.docker.internal:1234/v1
    volumes:
      - .:/app
    ports:
      - "8765:8765"
    command: ["python", "gui.py", "--config", "config.recommended.json", "--host", "0.0.0.0", "--port", "8765"]
